<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CCP Clans - Clash of Clans</title>
    <meta
      name="description"
      content="Join CCP Clans - Clash of Clans community. Connect with us on WhatsApp and check our clan stats!"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"

    <div class="container">
      <div class="profile-section">
        <div class="logo-wrapper">

            alt="CCP Clans Logo"
            class="logo"
          />

        <h1 class="clan-name">CCP CLANS</h1>

        <p class="clan-description">⚔️ Clash of Clans Community ⚔️</p>
      </div>

      <!-- Copy notification -->
      <div id="copyNotification" class="copy-notification">
        ✓ Tersalin!
      </div>

              />

          </div>
          <div class="link-content">
            <h3>Join WhatsApp Group</h3>
            <p>Gabung komunitas kami</p>
          </div>
          <div class="link-arrow">→</div>
        </a>

        <a
          href="https://clashofclansstats.com/id/clans/CCP-CLANS/8RPQRC82"
          class="link-card stats"
          target="_blank"
          rel="noopener noreferrer"
        >
          <div class="link-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"

        </a>
      </div>

      <footer class="footer">
        <p>Made with ❤️ for CCP Clans</p>
      </footer>

    <script src="script.js"></script>
